<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quote</title>
    <style>
      /* Apple-ish: clean typography, soft materials, subtle motion, lots of whitespace */
      :root {
        --bg0: #0b0b0c;
        --bg1: #0f1115;
        --card: rgba(255, 255, 255, 0.08);
        --card2: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.14);
        --border2: rgba(255, 255, 255, 0.10);
        --text: rgba(255, 255, 255, 0.94);
        --muted: rgba(255, 255, 255, 0.62);
        --muted2: rgba(255, 255, 255, 0.48);
        --shadow: 0 22px 70px rgba(0, 0, 0, 0.55);
        --radius: 24px;
        --radius2: 18px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        color: var(--text);
        background:
          radial-gradient(1200px 900px at 10% 0%, rgba(0, 122, 255, 0.20), transparent 55%),
          radial-gradient(1000px 800px at 90% 10%, rgba(255, 45, 85, 0.14), transparent 55%),
          radial-gradient(900px 700px at 50% 100%, rgba(52, 199, 89, 0.12), transparent 55%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Display", "SF Pro Text",
          Segoe UI, Roboto, Helvetica, Arial;
      }

      .wrap {
        width: min(980px, calc(100vw - 40px));
      }

      .card {
        border-radius: var(--radius);
        background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 22px 16px 22px;
        gap: 16px;
      }

      .brand {
        display: grid;
        gap: 6px;
      }

      .brand h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }

      .brand p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }

      .content {
        padding: 0 22px 22px 22px;
      }

      .quote-shell {
        border-radius: var(--radius2);
        border: 1px solid var(--border2);
        background: rgba(0,0,0,0.18);
        padding: 22px;
        position: relative;
        overflow: hidden;
      }

      .shine {
        position: absolute;
        inset: -2px;
        background: radial-gradient(600px 180px at 20% 0%, rgba(255,255,255,0.10), transparent 60%);
        pointer-events: none;
        opacity: 0.9;
      }

      .quote {
        margin: 0;
        font-size: clamp(22px, 3.2vw, 34px);
        line-height: 1.18;
        letter-spacing: -0.2px;
        text-wrap: balance;
      }

      .author {
        margin-top: 14px;
        font-size: 14px;
        color: var(--muted);
        letter-spacing: 0.1px;
      }

      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 14px;
        min-height: 22px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--muted2);
        font-size: 13px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.45);
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.06);
      }

      .actions {
        display: inline-flex;
        gap: 10px;
      }

      .controls {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .select {
        appearance: none;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.10);
        color: var(--text);
        border-radius: 999px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      /* Modal visibility control */
      .modal { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,0.45); backdrop-filter: blur(2px); }
      .modal.open { display: grid; }
      /* Ensure hidden attribute always wins */
      #favsModal[hidden] { display: none !important; }

      /* Apple-ish button feel */
      .btn {
        appearance: none;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.10);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.2px;
        cursor: pointer;
        transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
        user-select: none;
      }
      .btn:hover {
        background: rgba(255,255,255,0.14);
        border-color: rgba(255,255,255,0.24);
      }
      .btn:active { transform: scale(0.98); }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }

      /* Subtle loading skeleton */
      .skeleton {
        height: 16px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
        position: relative;
      }
      .skeleton::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-60%);
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
        animation: shimmer 1.2s infinite;
      }
      @keyframes shimmer {
        0% { transform: translateX(-60%); }
        100% { transform: translateX(60%); }
      }

      /* Gentle fade for quote updates */
      .fade {
        animation: fadeIn 220ms ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 560px) {
        .topbar { align-items: flex-start; }
        .meta { flex-direction: column; align-items: stretch; }
        .actions { width: 100%; }
        .btn { width: 100%; }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <main id="appMain" class="card" role="main" aria-live="polite">
        <!-- Conceptual checklist:
             1) Choose a reliable quote API and define output fields (quote + author)
             2) Build a minimal, premium UI (card, typography, spacing, button)
             3) Implement fetch + render with loading/error states
             4) Validate that a non-empty quote is displayed after each fetch
             5) Self-correct on failure (retry once) -->

        <header class="topbar">
          <div class="brand">
            <h1>Funny Quote </h1>
            <p>Max effort!. Fast. Refresh for something new.</p>
          </div>
          <div class="controls">
            <label for="intervalSelect" class="sr-only" style="position:absolute;left:-9999px;">Auto-refresh interval</label>
            <select id="intervalSelect" class="select" title="Auto-refresh interval">
              <option value="30000">30s</option>
              <option value="60000" selected>60s</option>
              <option value="120000">120s</option>
            </select>
            <button id="autoBtn" class="btn" type="button" aria-pressed="false" title="Toggle auto-refresh">Auto: Off</button>
            <button id="refreshBtn" class="btn" type="button">Refresh</button>
          </div>
        </header>

        <section class="content">
          <div class="quote-shell" aria-label="Quote">
            <div class="shine" aria-hidden="true"></div>

            <blockquote id="quoteText" class="quote">Loading…</blockquote>
            <cite id="quoteAuthor" class="author"></cite>

            <div class="meta">
              <div class="status">
                <span class="dot" aria-hidden="true"></span>
                <span id="statusText" aria-live="polite" aria-atomic="true">Initializing…</span>
              </div>

              <div class="actions">
                <button id="favToggleBtn" class="btn" type="button" title="Save to favorites" aria-pressed="false">
                  Save
                </button>
                <button id="copyBtn" class="btn" type="button" title="Copy quote">
                  Copy
                </button>
                <button id="openFavsBtn" class="btn" type="button" title="View favorites">
                  Favorites
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>
      
      <!-- Favorites Modal -->
      <div id="favsModal" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="favsTitle">
        <div class="card" style="width:min(740px, calc(100vw - 40px)); max-height: 80vh; overflow:auto;">
          <div class="topbar" style="padding-bottom:10px;">
            <div class="brand">
              <h1 id="favsTitle">Favorites</h1>
              <p>Saved quotes on this device</p>
            </div>
            <div class="controls">
              <button id="closeFavsBtn" class="btn" type="button">Close</button>
            </div>
          </div>
          <div class="content" id="favsList">
            <!-- dynamically rendered -->
          </div>
        </div>
      </div>
    </div>

    <script>
      // ✅ Browser-friendly API (CORS works): DummyJSON random quote
      // Returns: { id, quote, author }
      const QUOTE_URL = "https://dummyjson.com/quotes/random";

      const el = {
        quoteText: document.getElementById("quoteText"),
        quoteAuthor: document.getElementById("quoteAuthor"),
        refreshBtn: document.getElementById("refreshBtn"),
        statusText: document.getElementById("statusText"),
        copyBtn: document.getElementById("copyBtn"),
        main: document.getElementById("appMain"),
        favToggleBtn: document.getElementById("favToggleBtn"),
        openFavsBtn: document.getElementById("openFavsBtn"),
        favsModal: document.getElementById("favsModal"),
        closeFavsBtn: document.getElementById("closeFavsBtn"),
        favsList: document.getElementById("favsList"),
        autoBtn: document.getElementById("autoBtn"),
        intervalSelect: document.getElementById("intervalSelect"),
      };

      let lastRendered = { id: null, text: "", author: "" };
      const seenQuoteKeys = new Set();
      const LS_KEY_LAST = "rqg:lastQuote";
      const LS_KEY_FAVS = "rqg:favorites";
      let autoTimer = null;
      let autoOn = false;

      function setStatus(msg) {
        el.statusText.textContent = msg;
      }

      function setLoadingUI(isLoading) {
        el.refreshBtn.disabled = isLoading;
        el.copyBtn.disabled = isLoading || !lastRendered.text;
        if (el.main) el.main.setAttribute("aria-busy", String(isLoading));

        if (isLoading && !lastRendered.text) {
          // lightweight “Apple-ish” loading cue (only if we don't have cached content)
          el.quoteText.innerHTML = `<span class="skeleton" style="display:block; width: 86%;"></span>
                                   <span class="skeleton" style="display:block; width: 72%; margin-top: 10px;"></span>`;
          el.quoteAuthor.textContent = "";
        }
      }

      function isValidQuoteText(text) {
        const t = String(text || "").trim();
        if (!t) return false;
        if (t.toLowerCase().includes("loading")) return false;
        if (t.toLowerCase().includes("could not load")) return false;
        return true;
      }

      function normalizeQuotePayload(data) {
        // Self-correction: allow multiple shapes
        const text = (data && (data.quote || data.content || data.text)) || "";
        const author = (data && (data.author || data.by || data.source)) || "";
        const id = (data && (data.id || data._id)) ?? null;
        return { id, text: String(text).trim(), author: String(author).trim() };
      }

      function renderQuote({ id = null, text, author }) {
        lastRendered = { id, text, author };

        el.quoteText.textContent = text;
        el.quoteAuthor.textContent = author ? `— ${author}` : "";

        el.quoteText.classList.remove("fade");
        void el.quoteText.offsetWidth; // restart animation
        el.quoteText.classList.add("fade");

        el.copyBtn.disabled = !text;

        // Update favorite button state
        updateFavUI();

        // Persist last successful quote for quick startup
        try {
          localStorage.setItem(LS_KEY_LAST, JSON.stringify(lastRendered));
        } catch {}
      }

      async function fetchQuoteOnce(signal) {
        const res = await fetch(QUOTE_URL, { cache: "no-store", signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        return normalizeQuotePayload(data);
      }

      function quoteKey(q) {
        if (!q) return "";
        // Prefer API id if present, fall back to text fingerprint
        if (q.id != null) return `id:${q.id}`;
        return `t:${(q.text || "").slice(0, 120)}`;
      }

      function isDuplicate(q) {
        const key = quoteKey(q);
        return key && seenQuoteKeys.has(key);
      }

      async function fetchAndRenderQuote() {
        setLoadingUI(true);
        setStatus("Fetching a new quote…");

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 9000);

        try {
          // Up to 3 attempts to get a valid, non-duplicate quote
          let picked = null;
          for (let attempt = 1; attempt <= 3; attempt++) {
            const q = await fetchQuoteOnce(controller.signal);
            if (!isValidQuoteText(q.text)) {
              setStatus(attempt === 1 ? "Validation failed. Retrying…" : "Still invalid. Retrying…");
              continue;
            }
            if (isDuplicate(q)) {
              setStatus("Duplicate detected. Retrying…");
              continue;
            }
            picked = q;
            break;
          }

          if (!picked) {
            throw new Error("No valid unique quote after retries.");
          }

          // Track as seen for this session
          seenQuoteKeys.add(quoteKey(picked));
          renderQuote(picked);

          setStatus("Done.");
        } catch (err) {
          renderQuote({
            text: "Could not load a quote right now. Please try again.",
            author: "",
          });
          setStatus(`Error: ${err && err.message ? err.message : "Unknown error"}`);
        } finally {
          clearTimeout(timeout);
          setLoadingUI(false);
          // If auto is on, schedule next tick
          scheduleAuto();
        }
      }

      async function copyToClipboard() {
        const text = lastRendered.text;
        const author = lastRendered.author ? ` — ${lastRendered.author}` : "";
        const payload = text ? `${text}${author}` : "";

        if (!payload) return;

        try {
          await navigator.clipboard.writeText(payload);
          setStatus("Copied to clipboard.");
          setTimeout(() => setStatus("Done."), 900);
        } catch {
          // Fallback
          const ta = document.createElement("textarea");
          ta.value = payload;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          setStatus("Copied to clipboard.");
          setTimeout(() => setStatus("Done."), 900);
        }
      }

      el.refreshBtn.addEventListener("click", fetchAndRenderQuote);
      el.copyBtn.addEventListener("click", copyToClipboard);

      // ---- Favorites ----
      function loadFavs() {
        try {
          const arr = JSON.parse(localStorage.getItem(LS_KEY_FAVS) || "[]");
          return Array.isArray(arr) ? arr : [];
        } catch { return []; }
      }
      function saveFavs(list) {
        try { localStorage.setItem(LS_KEY_FAVS, JSON.stringify(list)); } catch {}
      }
      function isFavoritedCurrent() {
        if (!lastRendered || !isValidQuoteText(lastRendered.text)) return false;
        const key = quoteKey(lastRendered);
        return loadFavs().some(q => quoteKey(q) === key);
      }
      function updateFavUI() {
        const fav = isFavoritedCurrent();
        el.favToggleBtn.setAttribute("aria-pressed", String(fav));
        el.favToggleBtn.textContent = fav ? "Saved" : "Save";
        el.favToggleBtn.title = fav ? "Remove from favorites" : "Save to favorites";
        el.favToggleBtn.disabled = !lastRendered.text;
      }
      function toggleFavorite() {
        if (!lastRendered || !isValidQuoteText(lastRendered.text)) return;
        const key = quoteKey(lastRendered);
        const favs = loadFavs();
        const idx = favs.findIndex(q => quoteKey(q) === key);
        if (idx >= 0) {
          favs.splice(idx, 1);
          setStatus("Removed from favorites.");
        } else {
          favs.unshift({ ...lastRendered, savedAt: Date.now() });
          setStatus("Saved to favorites.");
        }
        saveFavs(favs);
        updateFavUI();
        // Re-render modal if open
        if (!el.favsModal.hidden) renderFavsList();
        setTimeout(() => setStatus("Done."), 900);
      }
      function renderFavsList() {
        const favs = loadFavs();
        if (!favs.length) {
          el.favsList.innerHTML = '<p class="author" style="margin: 0 0 12px 0;">No favorites yet.</p>';
          return;
        }
        const items = favs.map((q, i) => {
          const text = (q.text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          const author = (q.author || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          return `
            <div class="quote-shell" style="margin-bottom:12px;">
              <blockquote class="quote" style="margin:0;">${text}</blockquote>
              <cite class="author">${author ? "— " + author : ""}</cite>
              <div class="actions" style="margin-top:12px;">
                <button class="btn" data-act="copy" data-idx="${i}">Copy</button>
                <button class="btn" data-act="remove" data-idx="${i}">Remove</button>
              </div>
            </div>`;
        }).join("");
        el.favsList.innerHTML = items;
      }
      function openFavs() {
        renderFavsList();
        el.favsModal.hidden = false;
        el.favsModal.classList.add("open");
        el.favsModal.setAttribute("aria-hidden", "false");
        // Focus close button for accessibility
        el.closeFavsBtn.focus();
      }
      function closeFavs() {
        el.favsModal.classList.remove("open");
        el.favsModal.hidden = true;
        el.favsModal.setAttribute("aria-hidden", "true");
      }
      el.favToggleBtn.addEventListener("click", toggleFavorite);
      el.openFavsBtn.addEventListener("click", openFavs);
      el.closeFavsBtn.addEventListener("click", closeFavs);
      el.favsModal.addEventListener("click", (e) => { if (e.target === el.favsModal) closeFavs(); });
      el.favsList.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const idx = Number(btn.getAttribute("data-idx"));
        const favs = loadFavs();
        if (btn.dataset.act === "remove") {
          favs.splice(idx, 1);
          saveFavs(favs);
          renderFavsList();
          setStatus("Removed favorite.");
        } else if (btn.dataset.act === "copy") {
          const q = favs[idx];
          if (q) {
            const payload = q.text + (q.author ? ` — ${q.author}` : "");
            navigator.clipboard.writeText(payload).then(() => {
              setStatus("Copied to clipboard.");
              setTimeout(() => setStatus("Done."), 900);
            });
          }
        }
      });

      // ---- Auto-refresh ----
      function clearAuto() {
        if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
      }
      function currentInterval() {
        const v = Number(el.intervalSelect.value || 60000);
        return isFinite(v) && v > 0 ? v : 60000;
      }
      function scheduleAuto() {
        clearAuto();
        if (!autoOn) return;
        // If page hidden, wait until visible to schedule
        if (document.hidden) return;
        autoTimer = setTimeout(() => {
          if (!el.refreshBtn.disabled) {
            fetchAndRenderQuote();
          } else {
            scheduleAuto();
          }
        }, currentInterval());
      }
      function setAuto(on) {
        autoOn = on;
        el.autoBtn.setAttribute("aria-pressed", String(on));
        el.autoBtn.textContent = on ? "Auto: On" : "Auto: Off";
        setStatus(on ? "Auto-refresh enabled." : "Auto-refresh disabled.");
        if (on) scheduleAuto(); else clearAuto();
        setTimeout(() => setStatus("Done."), 900);
      }
      el.autoBtn.addEventListener("click", () => setAuto(!autoOn));
      el.intervalSelect.addEventListener("change", () => {
        if (autoOn) scheduleAuto();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          clearAuto();
        } else if (autoOn) {
          scheduleAuto();
        }
      });

      // Keyboard shortcuts: r/space to refresh, c to copy
      document.addEventListener("keydown", (e) => {
        const tag = (e.target && e.target.tagName) || "";
        const isTyping = /INPUT|TEXTAREA|SELECT/.test(tag) || e.isComposing;
        if (isTyping || e.metaKey || e.ctrlKey || e.altKey) return;

        if (e.key === "c" || e.key === "C") {
          e.preventDefault();
          if (!el.copyBtn.disabled) copyToClipboard();
        } else if (e.key === "r" || e.key === "R" || e.key === " ") {
          e.preventDefault();
          if (!el.refreshBtn.disabled) fetchAndRenderQuote();
        }
      });

      // Initial load: render last cached (if any) for instant paint, then fetch fresh
      try {
        const cached = JSON.parse(localStorage.getItem(LS_KEY_LAST) || "null");
        if (cached && isValidQuoteText(cached.text)) {
          renderQuote(cached);
          seenQuoteKeys.add(quoteKey(cached));
          setStatus("Loaded last quote. Fetching fresh…");
        }
      } catch {}

      fetchAndRenderQuote();
    </script>
  </body>
</html>
