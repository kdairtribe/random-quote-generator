<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quote</title>
    <style>
      /* Apple-ish: clean typography, soft materials, subtle motion, lots of whitespace */
      :root {
        --bg0: #0b0b0c;
        --bg1: #0f1115;
        --card: rgba(255, 255, 255, 0.08);
        --card2: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.14);
        --border2: rgba(255, 255, 255, 0.10);
        --text: rgba(255, 255, 255, 0.94);
        --muted: rgba(255, 255, 255, 0.62);
        --muted2: rgba(255, 255, 255, 0.48);
        --shadow: 0 22px 70px rgba(0, 0, 0, 0.55);
        --radius: 24px;
        --radius2: 18px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        color: var(--text);
        background:
          radial-gradient(1200px 900px at 10% 0%, rgba(0, 122, 255, 0.20), transparent 55%),
          radial-gradient(1000px 800px at 90% 10%, rgba(255, 45, 85, 0.14), transparent 55%),
          radial-gradient(900px 700px at 50% 100%, rgba(52, 199, 89, 0.12), transparent 55%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Display", "SF Pro Text",
          Segoe UI, Roboto, Helvetica, Arial;
      }

      .wrap {
        width: min(980px, calc(100vw - 40px));
      }

      .card {
        border-radius: var(--radius);
        background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 22px 16px 22px;
        gap: 16px;
      }

      .brand {
        display: grid;
        gap: 6px;
      }

      .brand h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }

      .brand p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }

      .content {
        padding: 0 22px 22px 22px;
      }

      .quote-shell {
        border-radius: var(--radius2);
        border: 1px solid var(--border2);
        background: rgba(0,0,0,0.18);
        padding: 22px;
        position: relative;
        overflow: hidden;
      }

      .shine {
        position: absolute;
        inset: -2px;
        background: radial-gradient(600px 180px at 20% 0%, rgba(255,255,255,0.10), transparent 60%);
        pointer-events: none;
        opacity: 0.9;
      }

      .quote {
        margin: 0;
        font-size: clamp(22px, 3.2vw, 34px);
        line-height: 1.18;
        letter-spacing: -0.2px;
        text-wrap: balance;
      }

      .author {
        margin-top: 14px;
        font-size: 14px;
        color: var(--muted);
        letter-spacing: 0.1px;
      }

      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 14px;
        min-height: 22px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--muted2);
        font-size: 13px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.45);
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.06);
      }

      .actions {
        display: inline-flex;
        gap: 10px;
      }

      /* Apple-ish button feel */
      .btn {
        appearance: none;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.10);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.2px;
        cursor: pointer;
        transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
        user-select: none;
      }
      .btn:hover {
        background: rgba(255,255,255,0.14);
        border-color: rgba(255,255,255,0.24);
      }
      .btn:active { transform: scale(0.98); }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }

      /* Subtle loading skeleton */
      .skeleton {
        height: 16px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
        position: relative;
      }
      .skeleton::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-60%);
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
        animation: shimmer 1.2s infinite;
      }
      @keyframes shimmer {
        0% { transform: translateX(-60%); }
        100% { transform: translateX(60%); }
      }

      /* Gentle fade for quote updates */
      .fade {
        animation: fadeIn 220ms ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 560px) {
        .topbar { align-items: flex-start; }
        .meta { flex-direction: column; align-items: stretch; }
        .actions { width: 100%; }
        .btn { width: 100%; }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <main class="card" role="main" aria-live="polite">
        <!-- Conceptual checklist:
             1) Choose a reliable quote API and define output fields (quote + author)
             2) Build a minimal, premium UI (card, typography, spacing, button)
             3) Implement fetch + render with loading/error states
             4) Validate that a non-empty quote is displayed after each fetch
             5) Self-correct on failure (retry once) -->

        <header class="topbar">
          <div class="brand">
            <h1>Funny Quote </h1>
            <p>Max effort!. Fast. Refresh for something new.</p>
          </div>
          <button id="refreshBtn" class="btn" type="button">Refresh</button>
        </header>

        <section class="content">
          <div class="quote-shell" aria-label="Quote">
            <div class="shine" aria-hidden="true"></div>

            <p id="quoteText" class="quote">Loading…</p>
            <div id="quoteAuthor" class="author"></div>

            <div class="meta">
              <div class="status">
                <span class="dot" aria-hidden="true"></span>
                <span id="statusText">Initializing…</span>
              </div>

              <div class="actions">
                <button id="copyBtn" class="btn" type="button" title="Copy quote">
                  Copy
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      // ✅ Browser-friendly API (CORS works): DummyJSON random quote
      // Returns: { id, quote, author }
      const QUOTE_URL = "https://dummyjson.com/quotes/random";

      const el = {
        quoteText: document.getElementById("quoteText"),
        quoteAuthor: document.getElementById("quoteAuthor"),
        refreshBtn: document.getElementById("refreshBtn"),
        statusText: document.getElementById("statusText"),
        copyBtn: document.getElementById("copyBtn"),
      };

      let lastRendered = { text: "", author: "" };

      function setStatus(msg) {
        el.statusText.textContent = msg;
      }

      function setLoadingUI(isLoading) {
        el.refreshBtn.disabled = isLoading;
        el.copyBtn.disabled = isLoading || !lastRendered.text;

        if (isLoading) {
          // lightweight “Apple-ish” loading cue
          el.quoteText.innerHTML = `<span class="skeleton" style="display:block; width: 86%;"></span>
                                   <span class="skeleton" style="display:block; width: 72%; margin-top: 10px;"></span>`;
          el.quoteAuthor.textContent = "";
        }
      }

      function isValidQuoteText(text) {
        const t = String(text || "").trim();
        if (!t) return false;
        if (t.toLowerCase().includes("loading")) return false;
        if (t.toLowerCase().includes("could not load")) return false;
        return true;
      }

      function normalizeQuotePayload(data) {
        // Self-correction: allow multiple shapes
        const text = (data && (data.quote || data.content || data.text)) || "";
        const author = (data && (data.author || data.by || data.source)) || "";
        return { text: String(text).trim(), author: String(author).trim() };
      }

      function renderQuote({ text, author }) {
        lastRendered = { text, author };

        el.quoteText.textContent = text;
        el.quoteAuthor.textContent = author ? `— ${author}` : "";

        el.quoteText.classList.remove("fade");
        void el.quoteText.offsetWidth; // restart animation
        el.quoteText.classList.add("fade");

        el.copyBtn.disabled = !text;
      }

      async function fetchQuoteOnce(signal) {
        const res = await fetch(QUOTE_URL, { cache: "no-store", signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        return normalizeQuotePayload(data);
      }

      async function fetchAndRenderQuote() {
        setLoadingUI(true);
        setStatus("Fetching a new quote…");

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 9000);

        try {
          // ---- API Call #1 ----
          const q1 = await fetchQuoteOnce(controller.signal);

          // ---- Validation #1 ----
          if (!isValidQuoteText(q1.text)) {
            // Minimal self-correction: retry once
            setStatus("Validation failed. Retrying…");
            const q2 = await fetchQuoteOnce(controller.signal);

            // ---- Validation #2 ----
            if (!isValidQuoteText(q2.text)) {
              throw new Error("Validation failed after retry (empty quote).");
            }
            renderQuote(q2);
          } else {
            renderQuote(q1);
          }

          setStatus("Done.");
        } catch (err) {
          renderQuote({
            text: "Could not load a quote right now. Please try again.",
            author: "",
          });
          setStatus(`Error: ${err && err.message ? err.message : "Unknown error"}`);
        } finally {
          clearTimeout(timeout);
          setLoadingUI(false);
        }
      }

      async function copyToClipboard() {
        const text = lastRendered.text;
        const author = lastRendered.author ? ` — ${lastRendered.author}` : "";
        const payload = text ? `${text}${author}` : "";

        if (!payload) return;

        try {
          await navigator.clipboard.writeText(payload);
          setStatus("Copied to clipboard.");
          setTimeout(() => setStatus("Done."), 900);
        } catch {
          // Fallback
          const ta = document.createElement("textarea");
          ta.value = payload;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          setStatus("Copied to clipboard.");
          setTimeout(() => setStatus("Done."), 900);
        }
      }

      el.refreshBtn.addEventListener("click", fetchAndRenderQuote);
      el.copyBtn.addEventListener("click", copyToClipboard);

      // Initial load
      fetchAndRenderQuote();
    </script>
  </body>
</html>
